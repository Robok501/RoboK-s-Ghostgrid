# Builds an unsigned iPhone app (.ipa) on GitHub's Macs.
# Sign and install it on your own iPhone with a sideload tool (e.g. iloader) and your free Apple ID.
name: iOS build (unsigned .ipa)

on:
  push:
    branches: [main, beat-this-model]  # TEMP: beat-this-model, remove before merging
    paths:
      - 'apps/mobile/**'
      - 'packages/core/**'
      - 'package-lock.json'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spleeter:
    uses: ./.github/workflows/spleeter-model.yml
  ios:
    needs: spleeter
    runs-on: macos-26  # TEMP: explicit image; macos-latest could not get a runner on 4 Nov 2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Core tests
        run: npm test --workspace @ghostgrid/core

      # Beat This! (MIT) ships inside the app. Not committed: fetched here and checked against a pinned SHA-256.
      - name: Fetch the beat model (Beat This!, MIT)
        run: |
          M=apps/mobile/modules/ghostgrid-engine/ios/Models
          mkdir -p "$M"
          curl -fsSL -o "$M/beat_this.onnx" https://huggingface.co/thebluescreen/beat-this-onnx/resolve/main/beat_this.onnx
          echo "ab31b5a815e2d90c6cb523e33f0ce45590fdcf80c4181a8115394d94633be14a  $M/beat_this.onnx" | shasum -a 256 -c -
          ls -la "$M"

      # Spleeter (Deezer) as the second separator: converted and checked by spleeter-model.yml, then copied into the app
      - uses: actions/download-artifact@v4
        with:
          name: spleeter-onnx
          path: apps/mobile/modules/ghostgrid-engine/ios/Models

      - name: Generate the iOS project (expo prebuild)
        working-directory: apps/mobile
        env:
          CI: 1
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build (Release, no code signing)
        working-directory: apps/mobile/ios
        run: |
          set +e
          xcodebuild \
            -workspace Ghostgrid.xcworkspace \
            -scheme Ghostgrid \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::group::Build errors"
            grep -E "error:|\*\* BUILD FAILED" xcodebuild.log | head -100
            echo "::endgroup::"
            tail -60 xcodebuild.log
          fi
          exit $STATUS

      - name: Check the native engine is inside the app
        working-directory: apps/mobile/ios
        run: |
          grep -q "GhostgridEngine" Podfile.lock
          grep -rq "GhostgridEngineModule" Pods/Target\ Support\ Files/Pods-Ghostgrid/ExpoModulesProvider.swift || grep -rq "GhostgridEngineModule" Ghostgrid/ build/Build/Intermediates.noindex 2>/dev/null
          strings build/Build/Products/Release-iphoneos/Ghostgrid.app/Ghostgrid | grep -q "GhostgridEngine"
          echo "GhostgridEngine is linked into Ghostgrid.app"
          test -s build/Build/Products/Release-iphoneos/Ghostgrid.app/beat_this.onnx
          echo "beat_this.onnx is inside Ghostgrid.app"
          test -s build/Build/Products/Release-iphoneos/Ghostgrid.app/spleeter_drums.onnx
          echo "spleeter_drums.onnx is inside Ghostgrid.app"

      - name: Package Ghostgrid.ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Ghostgrid.app Payload/
          zip -qry ../../../Ghostgrid.ipa Payload
          ls -la ../../../Ghostgrid.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Ghostgrid-ipa
          path: Ghostgrid.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: apps/mobile/ios/xcodebuild.log
          retention-days: 7
